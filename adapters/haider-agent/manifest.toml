[identity]
schema = 1
id = "haider-agent"
name = "Haider Agent"
revision = "0.0.966-thin-client-daemon-native-tools-v2"

[availability]
exec_paths = ["haider"]
required_exec_paths = ["haiderd"]
version_probe = ["haider", "--version"]
version_pattern = "haider"

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
auth_required = false
model = "ahrb-fake-v1"
# Account creation probes the OpenAI-compatible model catalog before accepting
# the provider. That control-plane request is served but is not a model turn.
allowed_paths = ["/v1/models", "/v1/chat/completions"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_CACHE_HOME = "{{profile}}/cache"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
HAIDER_PROFILE_DIR = "{{profile}}/haider/store"
HAIDER_RUNTIME_DIR = "{{profile}}/haider/runtime"
HAIDER_DISCOVERY_DISABLED = "{{profile}}/discovery-disabled"

[isolation]
generated_files = []
forbidden_roots = ["~/.config/haider", "~/.local/share/haider"]

# AHRB owns the resident daemon process group, waits through the public status
# CLI, then registers the fake provider exactly once in this isolated profile.
# Every benchmark turn remains a `haider run` thin-client invocation; AHRB does
# not speak or decode Haider's private socket protocol.
[daemon]
persistent = true
start = ["haiderd"]
initialize = [
  "haider", "account", "add", "ahrb",
  "--base-url", "{{base_url}}", "--no-auth", "--api-family", "openai",
  "--response-open-timeout", "2s", "--chunk-idle-timeout", "2s",
  "--semantic-progress-timeout", "2s", "--json"
]
pid_locator = "owned haiderd child process group"
grace_ms = 2000

[daemon.readiness]
kind = "command"
command = ["haider", "status", "--json", "--no-spawn"]
timeout_ms = 10000

[transport]
kind = "exec"
command = [
  "haider", "run", "-p", "{{prompt}}", "--model", "ahrb/{{model}}",
  "--output", "jsonl", "--allow-writes", "--allow-exec",
  "--timeout", "30s"
]
timeout_ms = 30000

[sessions]
list = ["haider", "sessions", "--json", "--no-spawn"]
id_pointer = "/session_id"

[next_input]
[agents]

[concurrency]
topology = "shared-daemon-sessions"
max_agents = 32
fanout_mode = "thin-client-session-fanout"

[tools.aliases]
write = "process_exec"
read = "process_exec"
fail = "process_exec"

[tools.bindings]
"process_exec.command" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

# `haider run --output jsonl` starts with a top-level accepted announcement,
# followed by durable RawEnvelope records whose discriminator is payload.type.
[events]
source = "stdout"
framing = "jsonl"
type_pointer = "/payload/type"
id_pointer = "/event_id"
cursor_pointer = "/seq"

[[events.rules]]
matches = "accepted"
event = "turn-accepted"

[[events.rules]]
matches = "run_state"
match_fields = { "/payload/state" = "thinking" }
event = "model-request"
payload_pointer = "/payload"

[[events.rules]]
matches = "item"
match_fields = { "/payload/event" = "completed", "/payload/item/item" = "tool_call" }
event = "tool-call"
payload_pointer = "/payload/item"
payload_bindings = { call_id = "/payload/item/call_id", name = "/payload/item/name", arguments = "/payload/item/args" }

[[events.rules]]
matches = "tool_result"
event = "tool-result"
payload_pointer = "/payload"
payload_bindings = { call_id = "/payload/call_id", result = "/payload/result" }

[[events.rules]]
matches = "item"
match_fields = { "/payload/event" = "completed", "/payload/item/item" = "agent_message" }
event = "model-response"
payload_pointer = "/payload/item"

[[events.rules]]
matches = "run_state"
match_fields = { "/payload/state" = "done" }
event = "terminal-success"
payload_pointer = "/payload"

[[events.rules]]
matches = "run_state"
match_fields = { "/payload/state" = "errored" }
event = "terminal-failure"
payload_pointer = "/payload"

[[events.rules]]
matches = "run_state"
match_fields = { "/payload/state" = "cancelled" }
event = "terminal-cancelled"
payload_pointer = "/payload"

[[events.rules]]
matches = "error"
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"state":"done"']
failure_stdout = ['"event":"error"', '"state":"errored"']
failures = { usage = 2, provider = 65, unavailable = 69, software = 70, io = 74, protocol = 76, blocked = 77, timeout = 124, cancelled = 130 }

[process]
executable_names = ["haiderd", "haider"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576

[capabilities.required]
headless = "haider run --output jsonl is a noninteractive thin client over the resident daemon"

[capabilities.optional]
sessions = "durable daemon sessions are listable with haider sessions --json --no-spawn"
resume = "haider resume and session recovery exist, but 0.0.966 exposes no headless continue-existing-session command"
durable_journal = "the daemon owns a transactional journal, but 0.0.966 exposes no finite raw per-session replay CLI"

# TODO(orchestrator): Haider 0.0.966 `resume <session-id>` enters the TUI, while
# `run` has no existing-session selector. Keep rows 30/35/37 UNSUPPORTED until a
# noninteractive continuation CLI is available; do not automate the TUI.
# TODO(orchestrator): `haider events --no-spawn` is finite but spans every
# session; `haider session <id> --watch --no-spawn` is scoped but follows.
# Wire row 40 only when Haider exposes a finite raw per-session replay command
# with cursor semantics and a safe native torn-tail fault-injection surface.
