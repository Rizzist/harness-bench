[identity]
schema = 1
id = "pi"
name = "Pi Coding Agent"
revision = "print-json-persisted-sessions-v3"

[availability]
exec_paths = ["pi"]
version_probe = ["pi", "--version"]
version_pattern = ""

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"

[[isolation.generated_files]]
path = "{{profile}}/home/.pi/agent/models.json"
mode = "0600"
content = '''{
  "providers": {
    "ahrb": {
      "baseUrl": "{{base_url}}/v1",
      "api": "openai-completions",
      "apiKey": "{{credential}}",
      "compat": {
        "supportsDeveloperRole": false,
        "supportsReasoningEffort": false
      },
      "models": [
        {
          "id": "{{model}}",
          "name": "AHRB Fake Model",
          "reasoning": false,
          "input": ["text"],
          "contextWindow": 128000,
          "maxTokens": 16384
        }
      ]
    }
  }
}
'''

[[isolation.generated_files]]
path = "{{profile}}/home/.pi/agent/auth.json"
mode = "0600"
content = '''{
  "ahrb": {
    "type": "api_key",
    "key": "{{credential}}"
  }
}
'''

[isolation]
forbidden_roots = ["~/.pi"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "pi", "-p", "{{prompt}}", "--provider", "ahrb", "--model", "{{model}}",
  "--mode", "json", "--session-dir", "{{profile}}/home/.pi/agent/sessions",
  "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files",
  "--no-themes", "--no-approve", "--offline", "--tools", "bash"
]
timeout_ms = 30000

[sessions]
# Pi 0.84.4 docs/json.md: first record is the persisted session header.
# dist/main.js createSessionManager opens --session inside --session-dir.
id_pointer = "/id"
store_paths = ["{{profile}}/home/.pi/agent/sessions"]
resume = [
  "pi", "-p", "{{prompt}}", "--provider", "ahrb", "--model", "{{model}}",
  "--mode", "json", "--session", "{{session_id}}", "--session-dir", "{{profile}}/home/.pi/agent/sessions",
  "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files",
  "--no-themes", "--no-approve", "--offline", "--tools", "bash"
]

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = "bash"
read = "bash"
fail = "bash"

[tools.bindings]
"bash.command" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/toolCallId"

# Stored real-run evidence: results/pi/2026-09-02T13:13:12Z-ca742db2/report.json.
# Authoritative `message_end` records carry complete typed content blocks and
# the source envelope carries /actor. The saved run has text but predates the
# row-69 thinking fixture. Pi 0.84.4 docs/json.md and docs/session-format.md
# define final text and thinking blocks; expansion avoids a fragile array index.
[events.narrative]
assistant_text_event = "model-response"
assistant_text_pointer = "/_ahrb_expanded/text"
assistant_text_match_fields = { "/_ahrb_expanded/type" = "text" }
assistant_text_aggregation = "complete-event"
reasoning_event = "model-response"
reasoning_pointer = "/_ahrb_expanded/thinking"
reasoning_match_fields = { "/_ahrb_expanded/type" = "thinking" }
reasoning_aggregation = "complete-event"
turn_pointer = "/actor"

# TODO(orchestrator): capture one real 0.84.x JSON transcript to reconfirm final
# assistant/agent_settled ordering, decide policy for the rare deferred stop
# reason, and determine whether retries need disabling for fault rows. JSON mode
# exits zero even for error/aborted, so the terminal rules remain authoritative.

[[events.rules]]
matches = "agent_start"
event = "turn-accepted"

[[events.rules]]
matches = "turn_start"
event = "model-request"

[[events.rules]]
matches = "tool_execution_start"
event = "tool-call"
payload_bindings = { call_id = "/toolCallId", name = "/toolName", arguments = "/args" }

[[events.rules]]
matches = "tool_execution_end"
event = "tool-result"
payload_bindings = { call_id = "/toolCallId", name = "/toolName", result = "" }

[[events.rules]]
matches = "message_end"
expand_pointer = "/message/content"
match_fields = { "/message/role" = "assistant", "/_ahrb_expanded/type" = "text" }
event = "model-response"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "message_end"
expand_pointer = "/message/content"
match_fields = { "/message/role" = "assistant", "/_ahrb_expanded/type" = "thinking" }
event = "model-response"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "message_end"
match_fields = { "/message/role" = "assistant", "/message/stopReason" = "stop" }
event = "terminal-success"

[[events.rules]]
matches = "message_end"
match_fields = { "/message/role" = "assistant", "/message/stopReason" = "length" }
event = "terminal-failure"

[[events.rules]]
matches = "message_end"
match_fields = { "/message/role" = "assistant", "/message/stopReason" = "error" }
event = "terminal-failure"

[[events.rules]]
matches = "message_end"
match_fields = { "/message/role" = "assistant", "/message/stopReason" = "aborted" }
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"stopReason":"stop"']
failure_stdout = ['"stopReason":"error"', '"stopReason":"aborted"']
failures = { provider = 1 }

[process]
executable_names = ["pi", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576
credential_carrier_paths = [
  "{{profile}}/home/.pi/agent/models.json",
  "{{profile}}/home/.pi/agent/auth.json",
]

[capabilities.injection_surface.provider]
method = "cli"
argv = ["--provider", "ahrb", "--model", "{{provider}}"]
argv_position = "suffix"

[capabilities.injection_surface.base_url]
method = "generated-config"
generated_path = "{{profile}}/home/.pi/agent/models.json"
json_pointer = "/providers/ahrb/baseUrl"

[capabilities.injection_surface.credential]
method = "generated-config"
generated_path = "{{profile}}/home/.pi/agent/auth.json"
json_pointer = "/ahrb/key"

[capabilities.required]
headless = "pi --print --mode json terminates without the TUI"
sessions = "Pi JSON mode persists a JSONL session under the isolated --session-dir"
resume = "pi --session reopens the exact persisted session ID in a fresh process"
secrets_hygiene_on_disk = "generated private models/auth files are the only permitted credential carriers"
tool_result_role_fidelity = "OpenAI-compatible tool messages preserve the native tool-result role"

[capabilities.optional]

# TODO(orchestrator): verify an actual SSE turn through the generated custom
# provider and pin one authoritative credential source; registration alone does
# not prove the models.json/auth.json runtime carrier.
# TODO(orchestrator): pin list/delete commands, repeated-delete semantics, and
# all lifecycle pointers before declaring session_ops_cli; `--session`,
# `--resume`, and `--fork` alone are insufficient.
