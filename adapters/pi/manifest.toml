[identity]
schema = 1
id = "pi"
name = "Pi Coding Agent"
revision = "print-json-v1"

[availability]
exec_paths = ["pi"]
version_probe = ["pi", "--version"]
version_pattern = ""

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions"]

[[fake_model.provider_templates]]
path = "{{profile}}/pi/models.json"
mode = "0600"
content = '''{
  "providers": {
    "ahrb": {
      "name": "AHRB Fake Model",
      "baseUrl": "{{base_url}}/v1",
      "apiKey": "{{credential}}",
      "api": "openai-completions",
      "models": [
        {
          "id": "ahrb-fake-v1",
          "name": "AHRB Fake Model",
          "reasoning": false,
          "input": ["text"],
          "contextWindow": 128000,
          "maxTokens": 16384
        }
      ]
    }
  }
}
'''

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
PI_CODING_AGENT_DIR = "{{profile}}/pi"
PI_CODING_AGENT_SESSION_DIR = "{{profile}}/pi/sessions"

[isolation]
generated_files = []
forbidden_roots = ["~/.pi"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "pi", "--print", "--mode", "json", "--provider", "ahrb", "--model", "{{model}}",
  "--session-dir", "{{profile}}/pi/sessions", "--session-id", "{{session_id}}",
  "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files",
  "--no-themes", "--approve", "--offline", "--tools", "bash", "--", "{{prompt}}"
]
timeout_ms = 30000

[sessions]
resume = [
  "pi", "--print", "--mode", "json", "--provider", "ahrb", "--model", "{{model}}",
  "--session-dir", "{{profile}}/pi/sessions", "--session-id", "{{session_id}}",
  "--no-extensions", "--no-skills", "--no-prompt-templates", "--no-context-files",
  "--no-themes", "--approve", "--offline", "--tools", "bash", "--", "{{prompt}}"
]
id_pointer = "/id"

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = "bash"
read = "bash"
fail = "bash"

[tools.bindings]
command = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/id"

[[events.rules]]
matches = "session"
event = "turn-accepted"

[[events.rules]]
matches = "agent_start"
event = "model-request"

[[events.rules]]
matches = "tool_execution_start"
event = "tool-call"

[[events.rules]]
matches = "tool_execution_end"
event = "tool-result"

[[events.rules]]
matches = "message_end"
match_fields = { "/message/role" = "assistant" }
event = "model-response"
payload_pointer = "/message"

[[events.rules]]
matches = "agent_settled"
event = "terminal-success"

[exit]
success = 0
success_stdout = ['"type":"agent_settled"']
failure_stdout = ['"stopReason":"error"', '"stopReason":"aborted"']
failures = { provider = 1 }

[process]
executable_names = ["pi", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576

[capabilities.required]
headless = "pi --print --mode json terminates without the TUI"
sessions = "Pi stores the exact caller-supplied UUID under the isolated session directory"
resume = "reusing pi --session-id reopens the persisted project session"

[capabilities.optional]

