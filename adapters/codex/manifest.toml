[identity]
schema = 1
id = "codex"
name = "OpenAI Codex CLI"
revision = "exec-jsonl-native-tools-v6"

[availability]
exec_paths = ["codex"]
# Availability runs before AHRB creates a disposable profile, so this remains a
# version-only probe of the resolved executable. It performs no model request
# and is not evidence for an isolated Codex execution; every benchmark launch
# below goes through the generated macOS owner-config deny launcher.
version_probe = ["codex", "--version"]
version_pattern = "codex-cli"

[fake_model]
dialect = "open-ai-responses"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/responses"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
CODEX_HOME = "{{profile}}/codex"

[isolation]
forbidden_roots = ["~/.codex"]

# Keep the provider route in one profile layer so row 65 can perturb the
# base-URL field without appending config flags after Codex's positional prompt.
[[isolation.generated_files]]
path = "{{profile}}/codex/ahrb.config.toml"
mode = "0600"
content = '''model_provider = "ahrb"
model_context_window = 128000

[model_providers.ahrb]
name = "AHRB Fake Model"
base_url = "{{base_url}}/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
request_max_retries = 0
stream_max_retries = 0
'''

# On macOS, keep disposable HOME/CODEX_HOME as the selected profile while also
# denying reads of the owner's documented Codex config and file credential
# store. Resolve the real home from the account database: $HOME is deliberately
# disposable here. Exact-file rules leave an owner-installed Codex executable
# beneath another .codex subtree readable. Official Codex docs name config.toml
# and CODEX_HOME/auth.json; workload-identity variables are removed so an
# externally named identity-token file cannot become an undeclared carrier.
[[isolation.generated_files]]
path = "{{profile}}/bin/codex-ahrb-isolated"
mode = "0700"
content = '''#!/bin/sh
set -eu
platform_probe=$1
sandbox_exec=$2
account_probe=$3
directory_service=$4
shift 4
platform=$("$platform_probe" -s 2>/dev/null)
if [ "$platform" = Darwin ]; then
  if [ ! -x "$sandbox_exec" ]; then
    echo 'ahrb codex launcher: sandbox-exec unavailable on macOS; refusing to run codex without the owner-config read guard' >&2
    exit 126
  fi
  account=$("$account_probe" -un 2>/dev/null) || {
    echo 'ahrb codex launcher: account lookup failed; refusing to infer the real home from disposable HOME' >&2
    exit 126
  }
  record=$("$directory_service" . -read "/Users/$account" NFSHomeDirectory 2>/dev/null) || {
    echo 'ahrb codex launcher: account database omitted the real home; refusing to run codex' >&2
    exit 126
  }
  real_home=${record#NFSHomeDirectory: }
  case "$real_home" in
    /*) ;;
    *) echo 'ahrb codex launcher: account database returned an invalid real home; refusing to run codex' >&2; exit 126 ;;
  esac
  case "$real_home" in
    *[!A-Za-z0-9_./-]*) echo 'ahrb codex launcher: real home cannot be represented safely in a sandbox profile; refusing to run codex' >&2; exit 126 ;;
  esac
  policy="(version 1) (allow default) (deny file-read* (literal \"$real_home/.codex/config.toml\") (literal \"$real_home/.codex/auth.json\"))"
  unset CODEX_ACCESS_TOKEN OPENAI_IDENTITY_TOKEN_FILE OPENAI_FEDERATION_RULE_ID OPENAI_WORKLOAD_IDENTITY_CONTEXT
  exec "$sandbox_exec" -p "$policy" "$@"
fi
exec "$@"
'''

[daemon]
persistent = false

# The generated launcher above is the external sandbox. Do not ask Codex to
# apply a nested macOS seatbelt profile for tool commands: sandbox_apply rejects
# that nesting before the fixture can run. `--disable shell_snapshot` and
# `allow_login_shell=false` (documented in 0.156.1:
# `codex features list`, config key `allow_login_shell`) keep codex from sourcing
# host login-shell files (/etc/zprofile -> path_helper, snapshot helpers). Those
# host-dependent descendants are reaped by codex before its terminal, so no
# owned final disk counter can exist for them on macOS (storage S1/S10 ERROR).
[transport]
kind = "exec"
command = [
  "{{profile}}/bin/codex-ahrb-isolated",
  "/usr/bin/uname", "/usr/bin/sandbox-exec", "/usr/bin/id", "/usr/bin/dscl",
  "codex", "exec", "--json", "--color", "never", "--skip-git-repo-check", "--disable", "plugins",
  "--disable", "shell_snapshot", "-c", "allow_login_shell=false",
  "--ignore-rules",
  "--profile", "ahrb",
  "--model", "{{model}}", "--dangerously-bypass-approvals-and-sandbox", "-C", "{{workspace}}",
  "{{prompt}}"
]
timeout_ms = 30000

[input]
prompt_uses_stdin = false

[sessions]
resume = [
  "{{profile}}/bin/codex-ahrb-isolated",
  "/usr/bin/uname", "/usr/bin/sandbox-exec", "/usr/bin/id", "/usr/bin/dscl",
  "codex", "exec", "--json", "--color", "never", "--skip-git-repo-check", "--disable", "plugins",
  "--disable", "shell_snapshot", "-c", "allow_login_shell=false",
  "--ignore-rules",
  "--profile", "ahrb",
  "--model", "{{model}}", "--dangerously-bypass-approvals-and-sandbox", "-C", "{{workspace}}",
  "resume", "{{session_id}}", "{{prompt}}"
]
id_pointer = "/thread_id"
# 0.156.1 session store: rollout JSONL plus the SQLite thread state and
# paginated thread-history databases (with WALs) that index/copy it.
store_paths = [
  "{{profile}}/codex/sessions",
  "{{profile}}/codex/state_5.sqlite",
  "{{profile}}/codex/state_5.sqlite-wal",
  "{{profile}}/codex/thread_history_1.sqlite",
  "{{profile}}/codex/thread_history_1.sqlite-wal",
]

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

# TODO(orchestrator): revalidate these known Codex tool item variants when the
# probed CLI changes its exec JSONL schema.
[tools.aliases]
write = ["shell_command", "exec_command", "shell"]
read = ["shell_command", "exec_command", "shell"]
fail = ["shell_command", "exec_command", "shell"]

[tools.bindings]
"shell_command.command" = "command"
"exec_command.command" = "cmd"
"shell.command_argv" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/item/id"

# Stored real-run evidence: results/codex/2026-09-02T13:22:50Z-0815bb8f/report.json.
# `item.completed` agent_message records carry one complete assistant item at
# /item/text and AHRB's per-turn source envelope carries /actor. That run has no
# reasoning record because it predates the row-69 reasoning fixture. Codex's
# exec JSONL schema also defines `item.completed` reasoning items with complete
# text at /item/text (codex-rs/exec/src/exec_events.rs, ReasoningItem).
[events.narrative]
assistant_text_event = "model-response"
assistant_text_pointer = "/item/text"
assistant_text_match_fields = { "/item/type" = "agent_message" }
assistant_text_aggregation = "complete-event"
reasoning_event = "model-response"
reasoning_pointer = "/item/text"
reasoning_match_fields = { "/item/type" = "reasoning" }
reasoning_aggregation = "complete-event"
turn_pointer = "/actor"

[[events.rules]]
matches = "thread.started"
event = "turn-accepted"

[[events.rules]]
matches = "turn.started"
event = "model-request"

[[events.rules]]
matches = "item.started"
match_fields = { "/item/type" = "command_execution" }
event = "tool-call"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", arguments = "/item" }

[[events.rules]]
matches = "item.started"
match_fields = { "/item/type" = "function_call" }
event = "tool-call"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", arguments = "/item" }

[[events.rules]]
matches = "item.started"
match_fields = { "/item/type" = "local_shell_call" }
event = "tool-call"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", arguments = "/item" }

[[events.rules]]
matches = "item.started"
match_fields = { "/item/type" = "file_change" }
event = "tool-call"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", arguments = "/item" }

[[events.rules]]
matches = "item.started"
match_fields = { "/item/type" = "patch_apply" }
event = "tool-call"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", arguments = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "command_execution" }
event = "tool-result"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", result = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "function_call" }
event = "tool-result"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", result = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "local_shell_call" }
event = "tool-result"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", result = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "file_change" }
event = "tool-result"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", result = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "patch_apply" }
event = "tool-result"
payload_pointer = "/item"
payload_bindings = { call_id = "/item/id", result = "/item" }

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "agent_message" }
event = "model-response"
payload_pointer = "/item"

[[events.rules]]
matches = "item.completed"
match_fields = { "/item/type" = "reasoning" }
event = "model-response"
payload_pointer = "/item"

[[events.rules]]
matches = "turn.completed"
event = "terminal-success"

[[events.rules]]
matches = "turn.failed"
event = "terminal-failure"

[[events.rules]]
matches = "error"
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"type":"turn.completed"']
# Codex may emit a non-fatal item.completed whose nested item.type is "error"
# when an unknown model ID uses fallback metadata. Structured turn failure,
# process exit, and the required success marker remain authoritative.
failure_stdout = ['"type":"turn.failed"']
failures = { provider = 1 }

[process]
executable_names = ["codex", "node"]

[resources]
# Codex creates one versioned SQLite log family in a fresh CODEX_HOME. Keep the
# complete 0.156.1 generation and the current 0.157.1 generation, including
# SQLite auxiliaries; absent compatibility paths contribute no growth.
log_paths = [
  "{{profile}}/codex/logs_1.sqlite",
  "{{profile}}/codex/logs_1.sqlite-shm",
  "{{profile}}/codex/logs_1.sqlite-wal",
  "{{profile}}/codex/logs_2.sqlite",
  "{{profile}}/codex/logs_2.sqlite-shm",
  "{{profile}}/codex/logs_2.sqlite-wal",
]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576

[capabilities.injection_surface.provider]
method = "cli"
argv = ["--model", "{{provider}}"]
argv_position = "replace-option"

[capabilities.injection_surface.base_url]
method = "generated-config"
generated_path = "{{profile}}/codex/ahrb.config.toml"
json_pointer = "/model_providers/ahrb/base_url"

[capabilities.injection_surface.credential]
method = "environment"
environment = "OPENAI_API_KEY"

[capabilities.required]
headless = "codex exec --json terminates without an interactive UI"
sessions = "Codex persists a thread under isolated CODEX_HOME"
resume = "codex exec resume reopens the prior thread in a fresh process"
tool_result_role_fidelity = "Responses function_call_output items preserve the native tool-result role"

[capabilities.optional]

# Row 65 replaces the existing public --model value and rewrites the generated
# mode-0600 profile's base_url before launch. No option is appended after the
# positional prompt.
# TODO(orchestrator): pin complete public create/list/fork/delete argv and the
# lifecycle JSON pointers before declaring session_ops_cli; `exec resume` alone
# is insufficient.
# TODO(orchestrator): pin a mode-0600 Codex-generated auth file containing
# `{{credential}}`, or revise SPEC-v2 rule 6 for env-only credentials, before
# declaring secrets_hygiene_on_disk.
# TODO(orchestrator): pin exact budget, tariff, usage carrier/scope/pointers, and
# network-denial behavior before declaring rows 66, 67, or the complete row 70.

# Storage declarations from the disposable 0.156.1 profile (L7b evidence):
# rollout JSONL under codex/sessions plus the SQLite thread state/history
# stores; logs_N.sqlite is the log database. Skills, queue, goals, memories and
# the installation id remain in the computed `other` family. No caps, close verb
# or sweep are documented, so S5/S7 stay honestly UNSUPPORTED.
# `codex delete --force <UUID>` (0.156.1 help: "Permanently delete a saved
# session", `--force` = no prompt, UUID required) ran headless on a disposable
# CODEX_HOME: exit 0, rollout removed, `threads` table empty. Codex has no
# disposable-profile uninstall command (`logout` only removes credentials).
[storage]
session_delete = [
  "{{harness}}", "delete", "--force", "--disable", "plugins", "{{session_id}}"
]

# Plugin clone staging remains part of exhaustive allocated-byte accounting.
# SPEC-v4 revision 4.1 permits bounded re-inventory, never exclusion.
[storage.areas]
store = ["codex/sessions/**", "codex/state_*.sqlite*", "codex/thread_history_*.sqlite*"]
logs = ["codex/logs_*.sqlite*"]
transient = ["codex/.tmp/**"]
