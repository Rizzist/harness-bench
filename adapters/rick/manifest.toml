[identity]
schema = 1
id = "rick"
name = "Rick"
revision = "exec-stream-json-native-tools-v2"

[availability]
exec_paths = ["rick"]
version_probe = ["rick", "version"]
version_pattern = "rick v"

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
RICK_HOME = "{{profile}}/home/.config/rick"
RICK_DATA = "{{profile}}/home/.local/share/rick"

[[isolation.generated_files]]
path = "{{profile}}/home/.config/rick/rick.json"
mode = "0600"
content = '''{
  "model": "ahrb/{{model}}",
  "provider": {
    "ahrb": {
      "type": "openai-compatible",
      "baseUrl": "{{base_url}}/v1",
      "apiKey": "{{credential}}"
    }
  }
}
'''

[isolation]
forbidden_roots = ["~/.config/rick", "~/.local/share/rick"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "rick", "exec", "--output-format", "stream-json", "--yolo",
  "--model", "ahrb/{{model}}", "{{prompt}}"
]
timeout_ms = 30000

[sessions]

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

# Rick v0.1.18 names this built-in BashTool `bash`.
# TODO(orchestrator): confirm whether older supported builds used the `shell`
# compatibility alias; it is selected only when the harness declares it with a
# string-valued command field.
[tools.aliases]
write = ["bash", "shell"]
read = ["bash", "shell"]
fail = ["bash", "shell"]

[tools.bindings]
"bash.command" = "command"
"shell.command" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/session_id"

# Stored real-run evidence: results/rick/2026-09-02T13:19:20Z-6208e81c/report.json.
# `text` records carry one complete assistant item at /text and the source
# envelope carries /actor. No stored reasoning/thinking record exists, so
# reasoning is intentionally omitted.
[events.narrative]
assistant_text_event = "model-response"
assistant_text_pointer = "/text"
assistant_text_match_fields = { "/type" = "text" }
assistant_text_aggregation = "complete-event"
turn_pointer = "/actor"

[[events.rules]]
matches = "done"
event = "turn-accepted"

[[events.rules]]
matches = "tool_start"
event = "model-request"

[[events.rules]]
matches = "text"
event = "model-request"

[[events.rules]]
matches = "tool_start"
event = "tool-call"
payload_pointer = "/tool"
payload_bindings = { arguments = "/tool/input" }

[[events.rules]]
matches = "tool_end"
event = "tool-result"
payload_pointer = "/tool"
payload_bindings = { arguments = "/tool/input", result = "/tool" }

[[events.rules]]
matches = "text"
event = "model-response"

[[events.rules]]
matches = "done"
event = "terminal-success"

[[events.rules]]
matches = "error"
event = "terminal-failure"

# TODO(orchestrator): Rick v0.1.x stream-json ToolRecord has name/input/output/
# is_error but no native call ID. AHRB therefore recovers the abstract call ID
# independently from the fixture metadata repeated in each tool_start/tool_end
# input. Capture a real transcript to confirm both records repeat input. This is
# sound for AHRB's serial per-invocation fixture calls, but Rick must expose an ID
# before arbitrary concurrent same-name calls can be correlated. Rick also emits
# no explicit accepted/model-request record, so `done`, `tool_start`, and `text`
# are retrospective proxies; replace them if a future release adds start events.
# Pin provider/authentication error exit codes against the orchestrator binary.

[exit]
success = 0
success_stdout = ['"type":"done"']
failure_stdout = ['"type":"error"']
failures = { provider = 1 }

[process]
executable_names = ["rick"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576
credential_carrier_paths = ["{{profile}}/home/.config/rick/rick.json"]

[capabilities.injection_surface.provider]
method = "cli"
argv = ["--model", "ahrb/{{provider}}"]
argv_position = "suffix"

[capabilities.injection_surface.base_url]
method = "generated-config"
generated_path = "{{profile}}/home/.config/rick/rick.json"
json_pointer = "/provider/ahrb/baseUrl"

[capabilities.injection_surface.credential]
method = "generated-config"
generated_path = "{{profile}}/home/.config/rick/rick.json"
json_pointer = "/provider/ahrb/apiKey"

[capabilities.required]
headless = "rick exec --output-format stream-json is noninteractive"
secrets_hygiene_on_disk = "the only permitted credential carrier is the generated private provider config"
tool_result_role_fidelity = "OpenAI-compatible tool messages preserve the native tool-result role"

[capabilities.optional]

# TODO(orchestrator): pin create/fork/delete commands, repeated-delete semantics,
# and lifecycle pointers before declaring session_ops_cli; `rick sessions` and
# `rick resume` are insufficient.
# TODO(orchestrator): pin budget controls, tariff, usage event/scope/five
# pointers, timestamps, and schema version before declaring rows 66, 67, or the
# optional row-69 metadata components.
# TODO(orchestrator): verify workspace-scoped filesystem and network denial
# commands before declaring headless_permission_model; unscoped `--yolo` cannot
# satisfy SPEC-v2 row 70.
