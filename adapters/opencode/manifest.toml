[identity]
schema = 1
id = "opencode"
name = "OpenCode"
revision = "1.17-run-format-json-native-tools-v4"

[availability]
exec_paths = ["opencode"]
version_probe = ["opencode", "--version"]
version_pattern = ""

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions"]

# OpenCode 1.17 removes a built-in agent from its catalog when its config entry
# has disable=true. Session title generation returns before model selection when
# that hidden title agent is absent, so no auxiliary request reaches AHRB.
[[isolation.generated_files]]
path = "{{profile}}/config/opencode/opencode.json"
mode = "0600"
content = '''{
  "$schema": "https://opencode.ai/config.json",
  "provider": {
    "ahrb": {
      "npm": "@ai-sdk/openai-compatible",
      "name": "AHRB Fake Model",
      "options": {
        "baseURL": "{{base_url}}/v1",
        "apiKey": "{{credential}}"
      },
      "models": {
        "{{model}}": { "name": "AHRB Fake Model" }
      }
    }
  },
  "model": "ahrb/{{model}}",
  "agent": {
    "title": { "disable": true }
  },
  "permission": {
    "bash": "allow"
  }
}
'''

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"

[isolation.environment]
OPENCODE_CONFIG = "{{profile}}/config/opencode/opencode.json"

[isolation]
forbidden_roots = ["~/.config/opencode", "~/.local/share/opencode"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "opencode", "run", "--format", "json", "--auto",
  "--model", "ahrb/{{model}}", "--dir", "{{workspace}}", "{{prompt}}"
]
timeout_ms = 30000

[sessions]
resume = [
  "opencode", "run", "--format", "json", "--auto",
  "--model", "ahrb/{{model}}", "--dir", "{{workspace}}",
  "--session", "{{session_id}}", "{{prompt}}"
]
id_pointer = "/sessionID"

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = "bash"
read = "bash"
fail = "bash"

[tools.bindings]
"bash.command" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

# OpenCode 1.17.20 `run --format json` emits a `tool_use` record only when the
# tool part reaches completed/error. AHRB therefore expands that one
# retrospective record into correlated call/result evidence.
# TODO(orchestrator): capture one installed 1.17.x transcript to reconfirm that
# the final `step_finish` with reason=stop is never lost when the process exits,
# and pin provider/authentication error exit codes.
[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/part/id"

[[events.rules]]
matches = "step_start"
event = "turn-accepted"

[[events.rules]]
matches = "step_start"
event = "model-request"

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "completed" }
event = "tool-call"
payload_pointer = "/part"
payload_bindings = { call_id = "/part/callID", name = "/part/tool", arguments = "/part/state/input" }

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "error" }
event = "tool-call"
payload_pointer = "/part"
payload_bindings = { call_id = "/part/callID", name = "/part/tool", arguments = "/part/state/input" }

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "completed" }
event = "tool-result"
payload_pointer = "/part"
payload_bindings = { call_id = "/part/callID", name = "/part/tool", arguments = "/part/state/input", result = "/part/state" }

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "error" }
event = "tool-result"
payload_pointer = "/part"
payload_bindings = { call_id = "/part/callID", name = "/part/tool", arguments = "/part/state/input", result = "/part/state" }

[[events.rules]]
matches = "text"
event = "model-response"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "stop" }
event = "terminal-success"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "length" }
event = "terminal-failure"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "content-filter" }
event = "terminal-failure"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "error" }
event = "terminal-failure"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "other" }
event = "terminal-failure"
payload_pointer = "/part"

[[events.rules]]
matches = "step_finish"
match_fields = { "/part/reason" = "unknown" }
event = "terminal-failure"
payload_pointer = "/part"

[[events.rules]]
matches = "error"
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"reason":"stop"']
failure_stdout = ['"type":"error"']
failures = { provider = 1 }

[process]
executable_names = ["opencode", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576
credential_carrier_paths = ["{{profile}}/config/opencode/opencode.json"]

[capabilities.injection_surface.provider]
method = "cli"
argv = ["--model", "ahrb/{{provider}}"]
argv_position = "suffix"

[capabilities.injection_surface.base_url]
method = "generated-config"
generated_path = "{{profile}}/config/opencode/opencode.json"
json_pointer = "/provider/ahrb/options/baseURL"

[capabilities.injection_surface.credential]
method = "generated-config"
generated_path = "{{profile}}/config/opencode/opencode.json"
json_pointer = "/provider/ahrb/options/apiKey"

[capabilities.required]
headless = "opencode run --format json emits raw JSON events noninteractively"
sessions = "OpenCode persists sessions under isolated XDG roots"
resume = "opencode run --session continues the prior session in a fresh process"
secrets_hygiene_on_disk = "the only permitted credential carrier is the generated private provider config"
tool_result_role_fidelity = "OpenAI-compatible tool messages preserve the native tool-result role"

[capabilities.optional]

# TODO(orchestrator): pin public create/list/resume/fork/delete commands and
# lifecycle pointers before declaring session_ops_cli; session export/import do
# not satisfy the row-68 lifecycle.
# TODO(orchestrator): pin all budget controls, tariff, usage event/scope/five
# pointers, and permission denial commands before declaring rows 66, 67, or 70.
# TODO(orchestrator): capture timestamp and schema-version fields from installed
# 1.17.x JSON events before declaring those row-69 metadata components.
