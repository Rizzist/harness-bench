[identity]
schema = 1
id = "opencode"
name = "OpenCode"
revision = "run-json-v1"

[availability]
exec_paths = ["opencode"]
version_probe = ["opencode", "--version"]
version_pattern = ""

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "OPENAI_BASE_URL"
credential_env = "OPENAI_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions"]

[[fake_model.provider_templates]]
path = "{{profile}}/config/opencode/opencode.json"
mode = "0600"
content = '''{
  "$schema": "https://opencode.ai/config.json",
  "provider": {
    "ahrb": {
      "npm": "@ai-sdk/openai-compatible",
      "name": "AHRB Fake Model",
      "options": {
        "baseURL": "{{base_url}}/v1",
        "apiKey": "{{credential}}"
      },
      "models": {
        "ahrb-fake-v1": { "name": "AHRB Fake Model" }
      }
    }
  },
  "model": "ahrb/ahrb-fake-v1"
}
'''

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
OPENCODE_CONFIG = "{{profile}}/config/opencode/opencode.json"

[isolation]
generated_files = []
forbidden_roots = ["~/.config/opencode", "~/.local/share/opencode"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "opencode", "run", "--pure", "--format", "json", "--auto",
  "--model", "ahrb/{{model}}", "--dir", "{{workspace}}", "{{prompt}}"
]
timeout_ms = 30000

[sessions]
resume = [
  "opencode", "run", "--pure", "--format", "json", "--auto",
  "--model", "ahrb/{{model}}", "--dir", "{{workspace}}",
  "--session", "{{session_id}}", "{{prompt}}"
]
id_pointer = "/sessionID"

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = "bash"
read = "bash"
fail = "bash"

[tools.bindings]
command = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

# TODO(orchestrator): confirm OpenCode's `tool_use` state transitions and bash
# input field against the installed release; completed events are deliberately
# expanded into both call and result evidence when no earlier state is emitted.
[events]
source = "stdout"
framing = "jsonl"
id_pointer = "/part/id"

[[events.rules]]
matches = "step_start"
event = "turn-accepted"

[[events.rules]]
matches = "step_start"
event = "model-request"

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "running" }
event = "tool-call"
payload_pointer = "/part"

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "completed" }
event = "tool-call"
payload_pointer = "/part"

[[events.rules]]
matches = "tool_use"
match_fields = { "/part/state/status" = "completed" }
event = "tool-result"
payload_pointer = "/part"

[[events.rules]]
matches = "text"
event = "model-response"
payload_pointer = "/part"

[exit]
success = 0
failure_stdout = ['"type":"error"']
failures = { provider = 1 }

[process]
executable_names = ["opencode", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["OPENAI_API_KEY"]
max_bytes = 1048576

[capabilities.required]
headless = "opencode run --format json is noninteractive"
sessions = "OpenCode persists sessions under isolated XDG roots"
resume = "opencode run --session continues the prior session in a fresh process"

[capabilities.optional]

