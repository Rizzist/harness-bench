[identity]
schema = 1
id = "claude-code"
name = "Claude Code"
revision = "print-stream-json-native-tools-v3"

[availability]
exec_paths = ["claude"]
version_probe = ["claude", "--version"]
version_pattern = "Claude Code"

[fake_model]
dialect = "anthropic-messages"
base_url_env = "ANTHROPIC_BASE_URL"
credential_env = "ANTHROPIC_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/messages"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
CLAUDE_CONFIG_DIR = "{{profile}}/claude"

[isolation]
generated_files = []
forbidden_roots = ["~/.claude"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "/usr/bin/env", "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1",
  "claude", "-p", "{{prompt}}", "--verbose", "--output-format", "stream-json",
  "--model", "{{model}}", "--add-dir", "{{workspace}}",
  "--dangerously-skip-permissions", "--allowedTools", "Bash",
  "--session-id", "{{session_id}}"
]
timeout_ms = 30000

[sessions]
resume = [
  "/usr/bin/env", "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1",
  "claude", "-p", "{{prompt}}", "--verbose", "--output-format", "stream-json",
  "--model", "{{model}}", "--add-dir", "{{workspace}}",
  "--dangerously-skip-permissions", "--allowedTools", "Bash",
  "--resume", "{{session_id}}"
]
id_pointer = "/session_id"

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = ["Bash", "bash"]
read = ["Bash", "bash"]
fail = ["Bash", "bash"]

[tools.bindings]
"Bash.command" = "command"
"bash.command" = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

# Claude Code 2.1.251 otherwise issues an auxiliary session-title model request
# containing the user's route marker but no tool declarations. Nonessential
# traffic is disabled so that request cannot consume the real turn checkpoint.
# TODO(orchestrator): capture one installed-version transcript to reconfirm that
# successful Bash tool_result blocks always carry is_error=false and that init
# remains the best available proxy for model-request. The lower-case bash alias
# is a compatibility fallback; the official 2.1.x model-visible name is Bash.
# Also pin process exit codes for every error_* subtype and permission failure.
[events]
source = "stdout"
framing = "jsonl"

[[events.rules]]
matches = "system"
match_fields = { "/subtype" = "init" }
event = "turn-accepted"

[[events.rules]]
matches = "system"
match_fields = { "/subtype" = "init" }
event = "model-request"

[[events.rules]]
matches = "assistant"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "tool_use" }
event = "tool-call"
payload_pointer = "/_ahrb_expanded"
payload_bindings = { call_id = "/_ahrb_expanded/id", arguments = "/_ahrb_expanded/input" }

[[events.rules]]
matches = "user"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "tool_result" }
event = "tool-result"
payload_pointer = "/_ahrb_expanded"
payload_bindings = { call_id = "/_ahrb_expanded/tool_use_id", result = "/_ahrb_expanded" }

[[events.rules]]
matches = "assistant"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "text" }
event = "model-response"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "success", "/is_error" = "false" }
event = "terminal-success"

[[events.rules]]
matches = "result"
match_fields = { "/is_error" = "true" }
event = "terminal-failure"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "error_max_turns" }
event = "terminal-failure"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "error_during_execution" }
event = "terminal-failure"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "error_max_budget_usd" }
event = "terminal-failure"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "error_max_structured_output_retries" }
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"subtype":"success"']
failure_stdout = ['"subtype":"error_']
failures = { provider = 1 }

[process]
executable_names = ["claude", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]
max_bytes = 1048576

[capabilities.injection_surface.provider]
method = "cli"
argv = ["--model", "{{provider}}"]
argv_position = "suffix"

[capabilities.injection_surface.base_url]
method = "environment"
environment = "ANTHROPIC_BASE_URL"

[capabilities.injection_surface.credential]
method = "environment"
environment = "ANTHROPIC_API_KEY"

[capabilities.required]
headless = "claude -p emits a terminal stream-json result"
sessions = "Claude Code persists a caller-supplied isolated session ID"
resume = "claude --resume reopens the prior session in a fresh process"
tool_result_role_fidelity = "Anthropic tool_result blocks preserve the native result role"

[capabilities.optional]

