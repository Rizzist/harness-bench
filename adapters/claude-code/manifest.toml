[identity]
schema = 1
id = "claude-code"
name = "Claude Code"
revision = "print-stream-json-v1"

[availability]
exec_paths = ["claude"]
version_probe = ["claude", "--version"]
version_pattern = "Claude Code"

[fake_model]
dialect = "anthropic-messages"
base_url_env = "ANTHROPIC_BASE_URL"
credential_env = "ANTHROPIC_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/messages"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"
CLAUDE_CONFIG_DIR = "{{profile}}/claude"

[isolation]
generated_files = []
forbidden_roots = ["~/.claude"]

[daemon]
persistent = false

[transport]
kind = "exec"
command = [
  "claude", "-p", "--bare", "--verbose", "--output-format", "stream-json",
  "--include-partial-messages", "--model", "{{model}}",
  "--dangerously-skip-permissions", "--allowedTools", "Bash",
  "--session-id", "{{session_id}}", "--", "{{prompt}}"
]
timeout_ms = 30000

[sessions]
resume = [
  "claude", "-p", "--bare", "--verbose", "--output-format", "stream-json",
  "--include-partial-messages", "--model", "{{model}}",
  "--dangerously-skip-permissions", "--allowedTools", "Bash",
  "--resume", "{{session_id}}", "--", "{{prompt}}"
]
id_pointer = "/session_id"

[next_input]
[agents]

[concurrency]
topology = "client-process-fanout"
max_agents = 8
fanout_mode = "client"

[tools.aliases]
write = "Bash"
read = "Bash"
fail = "Bash"

[tools.bindings]
command = "command"

[tools.fixtures]
write = ["{{ahrb_fixture}}", "write", "--path", "{{path}}", "--content", "{{content}}"]
read = ["{{ahrb_fixture}}", "read", "--path", "{{path}}"]
fail = ["{{ahrb_fixture}}", "fail", "--message", "{{message}}"]

# TODO(orchestrator): revalidate these stream-json predicates when testing a
# Claude Code release other than the probed 2.1.x output contract.
[events]
source = "stdout"
framing = "jsonl"

[[events.rules]]
matches = "system"
match_fields = { "/subtype" = "init" }
event = "turn-accepted"

[[events.rules]]
matches = "system"
match_fields = { "/subtype" = "init" }
event = "model-request"

[[events.rules]]
matches = "assistant"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "tool_use" }
event = "tool-call"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "user"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "tool_result" }
event = "tool-result"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "assistant"
expand_pointer = "/message/content"
match_fields = { "/_ahrb_expanded/type" = "text" }
event = "model-response"
payload_pointer = "/_ahrb_expanded"

[[events.rules]]
matches = "result"
match_fields = { "/subtype" = "success" }
event = "terminal-success"

[[events.rules]]
matches = "result"
match_fields = { "/is_error" = "true" }
event = "terminal-failure"

[exit]
success = 0
success_stdout = ['"type":"result"']
failure_stdout = ['"is_error":true', '"subtype":"error']
failures = { provider = 1 }

[process]
executable_names = ["claude", "node"]

[resources]
turn_timeout_ms = 30000
idle_timeout_ms = 2000
max_output_bytes = 1048576

[hooks]
[cleanup]
paths = ["{{profile}}"]

[capture]
redact_env = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]
max_bytes = 1048576

[capabilities.required]
headless = "claude -p emits a terminal stream-json result"
sessions = "Claude Code persists a caller-supplied isolated session ID"
resume = "claude --resume reopens the prior session in a fresh process"

[capabilities.optional]
