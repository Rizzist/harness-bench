[identity]
schema = 2
id = "ahrb-mock"
name = "AHRB built-in reference harness"
revision = "1"

[availability]
exec_paths = ["target/debug/ahrb-mock-harness"]
version_probe = ["target/debug/ahrb-mock-harness", "--help"]
version_pattern = "ahrb-mock-harness"

[fake_model]
dialect = "open-ai-chat-completions"
base_url_env = "AHRB_MOCK_BASE_URL"
credential_env = "AHRB_MOCK_API_KEY"
model = "ahrb-fake-v1"
allowed_paths = ["/v1/chat/completions", "/v1/models"]

[model_roles.primary]
model = "ahrb-fake-v1"
required = true

[model_roles.planner]
model = "ahrb-fake-v1"
required = false

[model_roles.title]
model = "ahrb-fake-v1"
required = false

[model_roles.compaction]
model = "ahrb-fake-v1"
required = false

[model_roles.reviewer]
model = "ahrb-fake-v1"
required = false

[model_roles.child]
model = "ahrb-fake-v1"
required = false

[isolation.roots]
HOME = "{{profile}}/home"
XDG_CONFIG_HOME = "{{profile}}/config"
XDG_DATA_HOME = "{{profile}}/data"
XDG_STATE_HOME = "{{profile}}/state"
XDG_RUNTIME_DIR = "{{profile}}/runtime"
TMPDIR = "{{profile}}/tmp"

[isolation]
forbidden_roots = ["~/.ahrb-mock"]

[[isolation.generated_files]]
path = "{{profile}}/config/ahrb-mock/credential.json"
content = '{"credential":"{{credential}}"}\n'
mode = "0600"

[daemon]
persistent = true
start = ["target/debug/ahrb-mock-harness", "serve", "--state-dir", "{{profile}}/state", "--idle-timeout-ms", "2500", "--session-memory-mib", "4", "--retry-max-attempts", "3", "--retry-base-delay-ms", "100", "--retry-max-delay-ms", "200"]
pid_locator = "{{profile}}/state/daemon.pid"
shutdown = ["harness.shutdown"]
grace_ms = 2000

[daemon.shutdown_result]
outcome_pointer = "/outcome"
clean_outcomes = ["stopped_cleanly", "not_running"]
escalate_outcomes = ["did_not_stop"]

[daemon.readiness]
kind = "command-json"
command = ["target/debug/ahrb-mock-harness", "status", "--state-dir", "{{profile}}/state"]
pid_pointer = "/daemon/pid"
ready_pointer = "/daemon/ready"
timeout_ms = 10000

[transport]
kind = "stdin-rpc"
command = ["target/debug/ahrb-mock-harness", "serve", "--state-dir", "{{profile}}/state", "--idle-timeout-ms", "2500", "--session-memory-mib", "4", "--retry-max-attempts", "3", "--retry-base-delay-ms", "100", "--retry-max-delay-ms", "200"]
endpoint = ""
timeout_ms = 30000

[sessions]
create = ["session.create"]
submit = ["session.submit"]
attach = ["session.attach"]
resume = ["session.resume"]
close_delete = ["session.close-delete"]
store_paths = ["{{profile}}/state/sessions"]
list = []
wait_ready = ["sessions.wait-ready"]
id_pointer = "/session_id"

[next_input]
steer = ["session.steer"]
subturn = ["session.subturn"]
queue = ["session.queue"]

[agents]
create = ["session.create"]
spawn = ["agent.spawn"]
status = ["session.attach"]
cancel = ["session.cancel"]
collect = ["session.attach"]
child_id_pointer = "/session_id"
status_result_pointer = "/events"
collect_events_pointer = "/events"

[concurrency]
topology = "shared-daemon-sessions"
max_agents = 32
fanout_mode = "native-sibling-fanout"
barrier_evidence = "barrier-reached"
release = ["checkpoint.release"]

[tools.aliases]
write = "write_fixture"
read = "read_fixture"
fail = "fail_fixture"
barrier = "barrier"
large_output = "large_output"

[tools.bindings]
path = "path"
content = "content"
call_id = "id"
child_marker = "marker"

[tools.fixtures]
write = ["write_fixture"]
read = ["read_fixture"]
fail = ["fail_fixture"]
barrier = ["barrier"]
large_output = ["target/debug/ahrb-fixture", "emit", "--bytes", "{{bytes}}"]

[events]
source = "journal"
path = "{{profile}}/state/sessions/{{session_id}}/journal.jsonl"
framing = "jsonl"
id_pointer = "/id"
cursor_pointer = "/cursor"

[events.metadata]
timestamp_pointer = "/payload/timestamp_ns"
timestamp_format = "monotonic-ns"
schema_version_pointer = "/payload/schema_version"
schema_version_value = "1"
usage_event = "terminal-success"
usage_scope = "turn"
input_tokens_pointer = "/payload/usage/input_tokens"
output_tokens_pointer = "/payload/usage/output_tokens"
total_tokens_pointer = "/payload/usage/total_tokens"
cost_microusd_pointer = "/payload/usage/cost_microusd"
turns_pointer = "/payload/usage/turns"

[events.narrative]
assistant_text_event = "model-response"
assistant_text_pointer = "/payload/assistant_text"
assistant_text_aggregation = "complete-event"
reasoning_event = "model-response"
reasoning_pointer = "/payload/reasoning"
reasoning_aggregation = "complete-event"
turn_pointer = "/actor"

[events.compaction]
event = "context-compacted"
turn_pointer = "/payload/turn_key"
dropped_count_pointer = "/payload/dropped_count"
dropped_span_start_pointer = "/payload/dropped_span/first"
dropped_span_end_pointer = "/payload/dropped_span/last"

[[events.rules]]
matches = "turn-accepted"
event = "turn-accepted"

[[events.rules]]
matches = "tool-call"
event = "tool-call"

[[events.rules]]
matches = "model-response"
event = "model-response"

[[events.rules]]
matches = "context-compacted"
event = "context-compacted"

[[events.rules]]
matches = "tool-result"
event = "tool-result"

[[events.rules]]
matches = "terminal-success"
event = "terminal-success"

[[events.rules]]
matches = "terminal-failure"
event = "terminal-failure"

[[events.rules]]
matches = "terminal-cancelled"
event = "terminal-cancelled"

[exit]
success = 0

[exit.failures]
denied = 10
invalid = 11
timeout = 12
cancel = 13
provider = 14

[process]
pid_files = ["{{profile}}/state/daemon.pid"]
executable_names = ["ahrb-mock-harness"]

[resources]
turn_timeout_ms = 10000
idle_timeout_ms = 2500
max_output_bytes = 1048576
retry_max_attempts = 3
retry_base_delay_ms = 100
retry_max_delay_ms = 200
log_paths = []
journal_paths = []

[resources.context_window]
surface = "environment"
tokens = 4096
environment = "AHRB_MOCK_CONTEXT_WINDOW_TOKENS"
argv = []
generated_path = ""
json_pointer = ""

[resources.budget_controls]
max_tokens = ["target/debug/ahrb-mock-harness", "budget-trial", "--state-dir", "{{profile}}/state", "--idle-timeout-ms", "7000", "--max-tokens", "{{budget_tokens}}"]
max_cost = ["target/debug/ahrb-mock-harness", "budget-trial", "--state-dir", "{{profile}}/state", "--idle-timeout-ms", "7000", "--max-cost", "{{budget_cost_usd}}"]
max_time = ["target/debug/ahrb-mock-harness", "budget-trial", "--state-dir", "{{profile}}/state", "--idle-timeout-ms", "7000", "--max-time-ms", "{{budget_time_ms}}"]

[resources.budget_controls.tariff]
surface = "environment"
input_microusd_per_token = 2
output_microusd_per_token = 3
input_environment = "AHRB_MOCK_INPUT_PRICE_MICROUSD"
output_environment = "AHRB_MOCK_OUTPUT_PRICE_MICROUSD"

[input]
prompt_uses_stdin = true

[hooks]
acceptance = ["target/debug/ahrb-mock-harness", "hook", "--path", "{{profile}}/state/hooks.jsonl"]
completion = ["target/debug/ahrb-mock-harness", "hook", "--path", "{{profile}}/state/hooks.jsonl"]

[cleanup]
command = ["harness.shutdown"]
paths = ["{{profile}}"]

[capture]
redact_env = ["AHRB_MOCK_API_KEY"]
max_bytes = 1048576
credential_carrier_paths = ["{{profile}}/config/ahrb-mock/credential.json"]

[capture.truncation_marker]
regex = 'TRUNCATED truncated=(?P<truncated>true) original=(?P<original_bytes>[0-9]+) payload=(?P<payload_bytes>[0-9]+) sha256=(?P<sha256>[0-9a-f]{64})'

[permissions]
mode = "allow-list-and-sandbox"
allow = ["target/debug/ahrb-mock-harness", "permission-trial", "--state-dir", "{{profile}}/state", "--case", "allow", "--workspace", "{{workspace}}"]
deny_filesystem = ["target/debug/ahrb-mock-harness", "permission-trial", "--state-dir", "{{profile}}/state", "--case", "deny-filesystem", "--outside-path", "{{outside_path}}"]
deny_network = ["target/debug/ahrb-mock-harness", "permission-trial", "--state-dir", "{{profile}}/state", "--case", "deny-network", "--blocked-host", "{{blocked_host}}", "--blocked-port", "{{blocked_port}}"]

[capabilities.injection_surface.provider]
method = "environment"
environment = "AHRB_MOCK_MODEL"

[capabilities.injection_surface.base_url]
method = "environment"
environment = "AHRB_MOCK_BASE_URL"

[capabilities.injection_surface.credential]
method = "environment"
environment = "AHRB_MOCK_API_KEY"

[capabilities.required]
headless = "reference harness never reads interactive input"
sessions = "fsync-backed per-session journals"
resume = "accepted turns are reconstructed from the journal"
steer = "safe-boundary injected input"
queue = "distinct queued turns"
durable_journal = "append-only fsync-backed JSONL source of truth"
context_limit_recovery = "deterministic compaction preserves instructions, goals, and exact tool correlations"
secrets_hygiene_on_disk = "one exact generated private credential carrier is excluded; all artifacts are scanned"
tool_result_role_fidelity = "Chat tool results use role=tool with exact call IDs"

[capabilities.optional]
parallel_tool_execution = "concurrent fixture calls expose durable reverse-release checkpoints"
native_delegation = "agent.spawn creates stable child sessions"
pre_tool_intervention = "session.subturn injects before the next model boundary"
hooks = "argv hooks configured through JSON environment bindings"
budget_enforcement = "public headless token/cost/time controls terminate with typed budget-exceeded JSON"
usage_reporting = "terminal-success events carry exact per-turn token/cost/turn usage"
headless_permission_model = "public allow-list and sandbox trials deny filesystem/network scope without prompting"

# Public close retains journals and metadata; the mock expires its close cache after 1 s.
[storage]
session_close = ["{{harness}}", "session-close", "--state-dir", "{{profile}}/state", "--session-id", "{{session_id}}"]
sweep_interval_s = 1
retention_cap_bytes = 4194304
