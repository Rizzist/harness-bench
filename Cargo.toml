[package]
name = "ahrb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"
description = "Agent Harness Readiness Benchmark"
license-file = "LICENSE.md"
repository = "https://github.com/Rizzist/harness-bench"

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["server", "tokio"] }
libc = "=0.2.189"
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.9.12"

[lib]
name = "ahrb"
path = "src/lib.rs"

[[bin]]
name = "ahrb"
path = "src/main.rs"

[[bin]]
name = "ahrb-mock-harness"
path = "src/bin/ahrb-mock-harness.rs"

[[bin]]
name = "ahrb-fixture"
path = "src/bin/ahrb-fixture.rs"

[[bin]]
name = "hbench"
path = "src/bin/hbench.rs"

[profile.dev]
debug = 0
incremental = false
